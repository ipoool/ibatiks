# =============================================================================
# Ibatiks — deployment production.
#
#   1. Salin .env.example menjadi .env di server, isi semua nilainya
#   2. docker compose -f docker-compose.prod.yml build
#   3. docker compose -f docker-compose.prod.yml up -d
#   4. docker compose -f docker-compose.prod.yml run --rm migrate /app/seed
#
# Caddy di depan menangani TLS otomatis dari Let's Encrypt, jadi backend dan
# frontend tidak perlu mengurus sertifikat sama sekali.
# =============================================================================

name: jastipin-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB wajib diisi}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    # Database sengaja tidak mem-publish port ke host: satu-satunya yang boleh
    # menghubunginya adalah service lain di jaringan internal compose ini.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Job sekali jalan yang menerapkan migrasi sebelum backend menerima trafik.
  migrate:
    image: ${IMAGE_REGISTRY:-jastipin}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-Owner}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@jastipin.id}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
    entrypoint: ["/app/migrate"]
    command: ["up"]

  backend:
    image: ${IMAGE_REGISTRY:-jastipin}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      APP_PORT: 8080
      APP_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN wajib diisi}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      UPLOAD_DIR: /data/uploads
      INVOICE_DIR: /data/invoices
      DEFAULT_DP_PERCENT: ${DEFAULT_DP_PERCENT:-50}
    volumes:
      - uploads:/data

  web:
    image: ${IMAGE_REGISTRY:-jastipin}/web:${IMAGE_TAG:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8080

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - backend
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
